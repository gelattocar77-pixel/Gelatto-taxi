<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FFD700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.button {
  display: block;
  width: 80%;
  margin: 15px auto;
  padding: 18px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
}

.taxi { background: #FFD700; color: black; }
.call { background: green; color: white; }
</style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<body>

<h1>Gelatto Taxi 24/7 🚖</h1>
<p>Pide tu taxi rápido y seguro</p>

<button class="button taxi" onclick="pedirTaxi()">
🚖 PEDIR TAXI
</button>

<button class="button call" onclick="llamar()">
📞 LLAMAR
</button>
<input type="text" id="destino" placeholder="¿A dónde vas?" style="width:90%;padding:10px;border-radius:10px;font-size:16px;">

<br><br>

<button onclick="cotizarDestino()" style="padding:10px 20px;border:none;border-radius:10px;background:#FFD700;font-weight:bold;border-radius:10px;">
🔍 buscar destino
</button>
<p id="precioTexto" style="color:#FFD700;font-size:22px;font-weight:bold;"></p>
<br><br>  
<div id="mapa" style="height:350px; margin-top:20px;"></div>
<script>
function pedirTaxi() {
  window.location.href = "https://wa.me/51932988222?text=Hola%20quiero%20un%20taxi%20Gelatto%20🚖";
}

function llamar() {
  window.location.href = "tel:+51932988222";
}
  function cotizarDestino() {
  let destino = document.getElementById("destino").value.toLowerCase();
  let precio = 0;

  if (destino.includes("hacienda")) {
    precio = 30;
  } else if (destino.includes("carmen")) {
    precio = 25;
  } else if (destino.includes("plaza")) {
    precio = 8;
  } else {
    precio = 12;
  }

  document.getElementById("precioTexto").innerHTML = "Precio aprox: S/ " + precio;
  }
</script>
<script>


<script>
  function calcularPrecio(distanciaKm) {

const tarifaBase = 4;
const precioKm = 2;
const precioMinimo = 7;

let precio = tarifaBase + (distanciaKm * precioKm);

if (precio < precioMinimo) {
precio = precioMinimo;
}

return precio;

  }

function pedirTaxi() {
  let distancia = 5; // por ahora fijo (simulación)
  let precio = calcularPrecio(distancia);

  alert("🚖 Tu viaje cuesta S/ " + precio);
}

</script>
<div id="mapa" style="height:350px; margin-top:20px;"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

  var map = L.map('mapa').setView([-13.41, -76.13], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data © OpenStreetMap contributors'
  }).addTo(map);
navigator.geolocation.getCurrentPosition(function(pos) {
  var lat = pos.coords.latitude;
  var lng = pos.coords.longitude;

  map.setView([lat, lng], 15);

  L.marker([lat, lng]).addTo(map)
    .bindPopup('Estás aquí 📍')
    .openPopup();
});
});
</script>

</body>
</html>
