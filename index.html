<script>
  function calcularPrecio(distanciaKm) {

const tarifaBase = 4;
const precioKm = 2;
const precioMinimo = 7;

let precio = tarifaBase + (distanciaKm * precioKm);

if (precio < precioMinimo) {
precio = precioMinimo;
}

return precio;

  }

function pedirTaxi() {
  let distancia = 5; // por ahora fijo (simulación)
  let precio = calcularPrecio(distancia);

}

window.buscarDestino = function() {
  var destino = document.getElementById("destino").value;

  if (destino === "") {
    alert("Escribe un destino");
    return;
  }

  fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(destino + ", Chincha, Peru"))
    .then(response => response.json())
    .then(data => {
      if (data.length > 0) {
        var lat = data[0].lat;
        var lon = data[0].lon;

        map.setView([lat, lon], 16);

        L.marker([lat, lon]).addTo(map)
          .bindPopup("Destino: " + destino)
          .openPopup();

var precio = calcularPrecio(distancia);

alert("Precio aprox: S/ " + precio);

    });
}
