<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
body {
  margin: 0;

  color: white;
  text-align: center;

  display: block;

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<body>

<h1>Gelatto Taxi 24/7 🚖</h1>
<p>Pide tu taxi rápido y seguro</p>

<button class="button taxi" onclick="pedirTaxi()">
🚖 PEDIR TAXI
</button>

<button class="button call" onclick="llamar()">
📞 LLAMAR
</button>
<div id="mapa" style="height:300px;"></div>
<script>
function pedirTaxi() {
  window.location.href = "https://wa.me/51932988222?text=Hola%20quiero%20un%20taxi%20Gelatto%20🚖";
}

function llamar() {
  window.location.href = "tel:+51932988222";
}
</script>
<script>
function initMap() {
  const ubicacion = { lat: -13.41, lng: -76.13 };

  const mapa = new google.maps.Map(document.getElementById("mapa"), {
    zoom: 14,
    center: ubicacion,
  });

  const marcador = new google.maps.Marker({
    position: ubicacion,
    map: mapa,
  });
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&callback=initMap" async defer></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  function calcularPrecio(distanciaKm) {
  const tarifaBase = 3;
  const precioKm = 1.5;
  return tarifaBase + (distanciaKm * precioKm);
}

function pedirTaxi() {
  let distancia = 5; // por ahora fijo (simulación)
  let precio = calcularPrecio(distancia);

  alert("🚖 Tu viaje cuesta S/ " + precio);
}
var map = L.map('mapa').setView([0, 0], 13);

navigator.geolocation.getCurrentPosition(function(pos) {
  var lat = pos.coords.latitude;
  var lng = pos.coords.longitude;

  map.setView([lat, lng], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data © OpenStreetMap contributors'
  }).addTo(map);

  L.marker([lat, lng]).addTo(map)
    .bindPopup('Estás aquí 📍')
    .openPopup();

}, function(error) {
  alert("Activa tu ubicación");
});
</script>
</body>
